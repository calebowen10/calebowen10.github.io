<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caleb Owen - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #4f5a5c;
            background-color: #ffffff;
        }

        header {
            background-color: white;
            padding: 1.5rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 600;
            color: #4f5a5c;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #5b9bd5;
        }

        main {
            min-height: calc(100vh - 90px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4.5rem 2rem;
        }

        .contact-container {
            width: 100%;
            max-width: 760px;
        }

        h1 {
            text-align: center;
            font-size: 3.4rem;
            line-height: 1.1;
            color: #4f5a5c;
            margin-bottom: 5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .form-group {
            margin-bottom: 2.2rem;
        }

        label {
            display: block;
            font-size: 1.1rem;
            color: #4f5a5c;
            margin-bottom: 0.55rem;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            border: 1.5px solid #4f5a5c;
            border-radius: 3px;
            padding: 0.85rem 1rem;
            font-size: 1.05rem;
            font-family: inherit;
            color: #333;
            background-color: white;
            outline: none;
        }

        input {
            height: 60px;
        }

        textarea {
            min-height: 190px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #d8ded9;
            font-style: italic;
        }

        input:focus,
        textarea:focus {
            border-color: #5b9bd5;
            box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
        }

        button {
            background-color: #4f5a5c;
            color: #dfe8d4;
            border: none;
            padding: 0.85rem 2.1rem;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3e484a;
        }

        .contact-note {
            text-align: center;
            margin-top: 2.5rem;
            color: #666;
            font-size: 0.95rem;
        }

        .contact-note a {
            color: #5b9bd5;
            text-decoration: none;
        }

        .contact-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding: 3rem 1.5rem;
            }

            h1 {
                font-size: 2.7rem;
                margin-bottom: 3rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">Caleb Owen</div>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <h1>Contact</h1>

            <form onsubmit="sendEmail(); return false;">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Your Name..." 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Your Email Address..." 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        placeholder="Your Message..." 
                        required
                    ></textarea>
                </div>

                <button type="submit">Submit</button>
            </form>

            <p class="contact-note">
                You can also reach me directly at 
                <a href="mailto:owencaleb1126@gmail.com">owencaleb1126@gmail.com</a>.
            </p>
        </section>
    </main>

    <script>
        function sendEmail() {
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            const subject = encodeURIComponent("Portfolio Contact from " + name);
            const body = encodeURIComponent(
                "Name: " + name + "\n" +
                "Email: " + email + "\n\n" +
                "Message:\n" + message
            );

            window.location.href = "mailto:calebowen1126@gmail.com?subject=" + subject + "&body=" + body;
        }
    </script>
</body>
</html>
